<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GCSE Results Story</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #canvas-container {
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border-radius: 12px;
      overflow: hidden;
      background-color: #e2f0d9;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<div id="canvas-container">
  <canvas id="animCanvas" width="900" height="500"></canvas>
</div>

<script>
const canvas = document.getElementById('animCanvas');
const ctx = canvas.getContext('2d');

// GCSE Results Data
const gcseResults = [
  { subject: 'Art & Design (Fine Art)', score: '8' },
  { subject: 'English Language', score: '3' },
  { subject: 'Further Mathematics', score: '8' },
  { subject: 'Mathematics', score: '8' },
  { subject: 'Biology', score: '6' },
  { subject: 'Chemistry', score: '5' },
  { subject: 'Physics', score: '7' },
  { subject: 'English as Second Lang.', score: '7' }
];

// State Variables
let meterValue = 0; // 0 = Sad, 1 = Happy
let targetMeterValue = 0;
let dogX = 950; // Starts off-screen right
let paperOpacity = 0;
let paperScale = 0.2;
let showPaperPop = false;
let isHugging = false;
let startTime = null;

function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  let elapsed = (timestamp - startTime) / 1000; // seconds

  // Timeline Control
  if (elapsed > 1.5 && elapsed <= 4.0) {
    // Dog walks in
    dogX = Math.max(520, 950 - (elapsed - 1.5) * 172);
  } else if (elapsed > 4.0 && elapsed <= 7.0) {
    // Dog hands over paper / show paper floating into view
    showPaperPop = true;
    if (paperOpacity < 1) paperOpacity += 0.03;
    if (paperScale < 1) paperScale += 0.02;
  } else if (elapsed > 7.0 && elapsed <= 9.0) {
    // Dog steps in to hug; results fade out
    isHugging = true;
    if (paperOpacity > 0) paperOpacity -= 0.05; // Fade out paper
    dogX = Math.max(380, 520 - (elapsed - 7.0) * 70);
    targetMeterValue = 1; // Fox shifts to happy
  } else if (elapsed > 9.0) {
    paperOpacity = 0; // Completely hidden after hug
  }

  // Smoothly interpolate happiness meter
  meterValue += (targetMeterValue - meterValue) * 0.04;

  // --- DRAW SCENE ---
  // Background
  ctx.fillStyle = '#eaf4e0';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#a8d5e2';
  ctx.fillRect(0, 0, canvas.width, 320);

  // 1. Draw Happiness Meter (Left Side)
  drawHappinessMeter(ctx, meterValue);

  // 2. Draw Characters
  let foxX = 300;
  let foxY = 320;

  if (isHugging) {
    drawWhiteDog(ctx, dogX, 320);
    drawCuteFox(ctx, foxX, foxY, meterValue);
  } else {
    drawCuteFox(ctx, foxX, foxY, meterValue);
    drawWhiteDog(ctx, dogX, 320);
  }

  // 3. Draw GCSE Paper Popup (Text Results Card)
  if (showPaperPop && paperOpacity > 0) {
    ctx.save();
    ctx.translate(450, 180);
    ctx.scale(paperScale, paperScale);
    ctx.globalAlpha = Math.max(0, paperOpacity);
    
    // Paper shadow & frame
    const cardWidth = 320;
    const cardHeight = 260;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,0.25)';
    ctx.shadowBlur = 15;
    ctx.fillRect(-cardWidth / 2, -cardHeight / 2, cardWidth, cardHeight);
    ctx.shadowBlur = 0;

    // Header Bar
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(-cardWidth / 2, -cardHeight / 2, cardWidth, 32);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('OFFICIAL GCSE RESULTS', 0, -cardHeight / 2 + 21);

    // Render Subjects & Scores
    ctx.font = '12px Arial';
    let startY = -cardHeight / 2 + 52;

    gcseResults.forEach((item, index) => {
      let rowY = startY + index * 24;

      if (index % 2 === 0) {
        ctx.fillStyle = '#f8f9fa';
        ctx.fillRect(-cardWidth / 2 + 10, rowY - 14, cardWidth - 20, 20);
      }

      ctx.fillStyle = '#333333';
      ctx.textAlign = 'left';
      ctx.fillText(item.subject, -cardWidth / 2 + 20, rowY);

      ctx.fillStyle = '#1e824c';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'right';
      ctx.fillText(`Grade: ${item.score}`, cardWidth / 2 - 20, rowY);
      ctx.font = '12px Arial';
    });

    ctx.restore();
  }

  requestAnimationFrame(animate);
}

// Draw Happiness / Sadness Meter
function drawHappinessMeter(ctx, happiness) {
  const x = 40;
  const y = 80;
  const width = 30;
  const height = 300;

  // Label Top
  ctx.fillStyle = '#2b2b2b';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('😊 Happy', x - 10, y - 15);

  // Meter Outer Frame
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#333333';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(x, y, width, height, 15);
  ctx.fill();
  ctx.stroke();

  // Meter Fill (Gradient Red->Yellow->Green)
  let fillHeight = height * happiness;
  let grad = ctx.createLinearGradient(0, y + height, 0, y);
  grad.addColorStop(0, '#ff4d4d');
  grad.addColorStop(0.5, '#ffd11a');
  grad.addColorStop(1, '#4cd964');

  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x + 3, y + 3 + (height - fillHeight), width - 6, fillHeight - 6, 10);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // Label Bottom
  ctx.fillStyle = '#2b2b2b';
  ctx.fillText('😢 Sad', x - 5, y + height + 25);
}

// Draw Cute, Slim Fox
function drawCuteFox(ctx, x, y, happiness) {
  ctx.save();
  ctx.translate(x, y);

  // Tail
  ctx.fillStyle = '#e65c00';
  ctx.beginPath();
  ctx.ellipse(-35, -20, 15, 40, -Math.PI / 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(-45, -35, 8, 15, -Math.PI / 4, 0, Math.PI * 2);
  ctx.fill();

  // Slim Body
  ctx.fillStyle = '#f06711';
  ctx.beginPath();
  ctx.ellipse(0, -35, 22, 45, 0, 0, Math.PI * 2);
  ctx.fill();

  // White Chest
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(0, -30, 12, 30, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#f06711';
  ctx.beginPath();
  ctx.arc(0, -85, 28, 0, Math.PI * 2);
  ctx.fill();

  // Big Cute Ears
  ctx.beginPath();
  ctx.moveTo(-20, -95);
  ctx.lineTo(-32, -135);
  ctx.lineTo(-5, -105);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(20, -95);
  ctx.lineTo(32, -135);
  ctx.lineTo(5, -105);
  ctx.fill();

  // Inner Ears
  ctx.fillStyle = '#fce4d6';
  ctx.beginPath();
  ctx.moveTo(-18, -97);
  ctx.lineTo(-28, -128);
  ctx.lineTo(-8, -105);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(18, -97);
  ctx.lineTo(28, -128);
  ctx.lineTo(8, -105);
  ctx.fill();

  // Face Cheeks
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-14, -75, 12, 0, Math.PI * 2);
  ctx.arc(14, -75, 12, 0, Math.PI * 2);
  ctx.fill();

  // Nose
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(0, -78, 4, 0, Math.PI * 2);
  ctx.fill();

  // Facial Expressions (Explicit Sad vs Happy Transition)
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2.5;

  if (happiness < 0.5) {
    // SAD EXPRESSION: Tear drop, downturned eyebrows, droopy eyes, frown
    // Tear Drop
    ctx.fillStyle = '#64b5f6';
    ctx.beginPath();
    ctx.arc(-16, -72, 3, 0, Math.PI * 2);
    ctx.fill();

    // Downturned Eyebrows
    ctx.beginPath();
    ctx.moveTo(-15, -96); ctx.lineTo(-5, -92);
    ctx.moveTo(15, -96); ctx.lineTo(5, -92);
    ctx.stroke();

    // Sad Eyes (Arcs curving downwards)
    ctx.beginPath();
    ctx.arc(-10, -84, 5, Math.PI, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(10, -84, 5, Math.PI, 0);
    ctx.stroke();

    // Sad Frown (Curving downwards)
    ctx.beginPath();
    ctx.arc(0, -68, 7, Math.PI, 0);
    ctx.stroke();
  } else {
    // HAPPY EXPRESSION: Rosy cheeks, joyful eyes, wide smile
    // Rosy Cheeks
    ctx.fillStyle = '#ffb3ba';
    ctx.beginPath();
    ctx.arc(-18, -75, 5, 0, Math.PI * 2);
    ctx.arc(18, -75, 5, 0, Math.PI * 2);
    ctx.fill();

    // Happy Crescent Eyes (^ ^ shape)
    ctx.beginPath();
    ctx.arc(-10, -85, 5, 0, Math.PI, true);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(10, -85, 5, 0, Math.PI, true);
    ctx.stroke();

    // Big Happy Smile
    ctx.beginPath();
    ctx.arc(0, -75, 8, 0, Math.PI);
    ctx.stroke();
  }

  // Legs
  ctx.strokeStyle = '#f06711';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(-10, 0); ctx.lineTo(-10, 25);
  ctx.moveTo(10, 0); ctx.lineTo(10, 25);
  ctx.stroke();

  ctx.restore();
}

// Draw Fluffy White Dog
function drawWhiteDog(ctx, x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Fluffy Body
  ctx.fillStyle = '#f7f7f7';
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.arc(0, -35, 32, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Fluffy Head
  ctx.beginPath();
  ctx.arc(0, -80, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Floppy Ears
  ctx.beginPath();
  ctx.ellipse(-28, -80, 10, 20, 0.2, 0, Math.PI * 2);
  ctx.ellipse(28, -80, 10, 20, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Eyes & Pink Nose
  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath();
  ctx.arc(-9, -83, 3.5, 0, Math.PI * 2);
  ctx.arc(9, -83, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ff9999';
  ctx.beginPath();
  ctx.arc(0, -75, 4.5, 0, Math.PI * 2);
  ctx.fill();

  // Happy Smile
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -73, 5, 0, Math.PI);
  ctx.stroke();

  // Stubby Paws
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-12, 20, 9, 0, Math.PI * 2);
  ctx.arc(12, 20, 9, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// Start Animation Loop
requestAnimationFrame(animate);
</script>

</body>
</html>
