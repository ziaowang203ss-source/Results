<title>Fox GCSE Results</title>


<style>

/* =====================================================
   BASIC PAGE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

}

body {

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #080711;

}


/* =====================================================
   BACKGROUND
===================================================== */

.scene {

    position: relative;

    width: 100%;
    height: 100vh;

    background:

        radial-gradient(
            circle at 50% 45%,
            #302947 0%,
            #181427 55%,
            #07060d 100%
        );

}


/* =====================================================
   SADNESS METER
===================================================== */

.sadness-meter {

    position: absolute;

    left: 30px;
    top: 50%;

    transform: translateY(-50%);

    width: 125px;

    z-index: 100;

    text-align: center;

    color: white;

}


.meter-title {

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 1px;

    margin-bottom: 10px;

    color: #f5dfff;

    text-shadow:

        0 0 8px #bd79ff,

        0 0 18px #8c54d9;

}


.meter {

    position: relative;

    width: 100%;

    height: 370px;

}


/* Bar background */

.meter-track {

    position: absolute;

    left: 50%;

    top: 25px;

    transform: translateX(-50%);

    width: 25px;

    height: 300px;

    border-radius: 20px;

    background: #211c32;

    border: 3px solid #5c5277;

    overflow: hidden;

    box-shadow:

        0 0 15px rgba(180,120,255,0.3);

}


/* Filled sadness */

.meter-fill {

    position: absolute;

    left: 0;

    bottom: 0;

    width: 100%;

    height: 78%;

    border-radius: 20px;

    background:

        linear-gradient(

            to top,

            #5b4bff,

            #9c6bff,

            #ff70b5

        );

    transition:

        height 1.5s ease;

}


/* White indicator */

.mood-indicator {

    position: absolute;

    left: 50%;

    bottom: 78%;

    transform: translate(-50%, 50%);

    width: 43px;

    height: 43px;

    border-radius: 50%;

    background: white;

    border: 4px solid #ff72b8;

    box-shadow:

        0 0 12px #ff72b8,

        0 0 25px #ff72b8;

    transition:

        bottom 1.5s ease,

        border-color 1s ease;

}


/* Mood labels */

.mood-label {

    position: absolute;

    width: 100%;

    left: 0;

    z-index: 5;

    font-weight: bold;

    font-size: 17px;

    line-height: 20px;

}


.mood-label span {

    font-size: 10px;

    letter-spacing: 1px;

}


.mood-label.happy {

    top: -5px;

    color: #ffe66d;

}


.mood-label.okay {

    top: 145px;

    color: #ded9eb;

}


.mood-label.sad {

    bottom: -2px;

    color: #82b8ff;

}


.sadness-number {

    margin-top: 8px;

    font-size: 13px;

    color: #ddd7eb;

}


/* =====================================================
   FOX
===================================================== */

.fox {

    position: absolute;

    width: 390px;

    height: 430px;

    left: 43%;

    top: 48%;

    transform:
        translate(-50%, -50%);

    z-index: 20;

    animation:

        nervousFox
        0.7s
        ease-in-out
        infinite
        alternate;

}


@keyframes nervousFox {

    from {

        transform:
            translate(-50%, -50%)
            rotate(-1deg);

    }

    to {

        transform:
            translate(-50%, -50%)
            rotate(1deg);

    }

}


.fox-svg {

    width: 100%;
    height: 100%;

    overflow: visible;

    filter:

        drop-shadow(
            0 15px 20px
            rgba(0,0,0,0.35)
        );

}


/* =====================================================
   FOX TAIL
===================================================== */

.tail {

    transform-origin: 110px 315px;

    animation:

        tailNervous
        1s
        ease-in-out
        infinite
        alternate;

}


@keyframes tailNervous {

    from {
        transform: rotate(-5deg);
    }

    to {
        transform: rotate(6deg);
    }

}


/* =====================================================
   FUR
===================================================== */

.fur {

    animation:

        furMove
        0.8s
        ease-in-out
        infinite
        alternate;

}


@keyframes furMove {

    from {
        transform: translateX(-1px);
    }

    to {
        transform: translateX(1px);
    }

}


/* =====================================================
   EARS
===================================================== */

.ear-left {

    transform-origin: 120px 95px;

    animation:

        earLeft
        1.2s
        ease-in-out
        infinite;

}


.ear-right {

    transform-origin: 280px 95px;

    animation:

        earRight
        1.1s
        ease-in-out
        infinite;

}


@keyframes earLeft {

    0%,100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(-8deg);
    }

}


@keyframes earRight {

    0%,100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(8deg);
    }

}


/* =====================================================
   FOX EYES
===================================================== */

.eye {

    transform-origin: center;

    animation:

        blink
        3.5s
        infinite;

}


@keyframes blink {

    0%, 88%, 100% {
        transform: scaleY(1);
    }

    92% {
        transform: scaleY(0.1);
    }

}


/* =====================================================
   SWEAT DROP
===================================================== */

.sweat {

    animation:

        sweat
        1.7s
        ease-in-out
        infinite;

}


@keyframes sweat {

    0% {

        opacity: 0;

        transform:
            translateY(-5px);

    }

    25% {
        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translateY(45px);

    }

}


/* =====================================================
   PUPPY
===================================================== */

.puppy {

    position: absolute;

    width: 310px;

    height: 330px;

    right: -350px;

    top: 45%;

    transform:
        translateY(-50%);

    z-index: 40;

    transition:

        right
        2.5s
        cubic-bezier(.2,.8,.2,1);

}


/* Puppy enters */

.puppy.arrive {

    right: 10%;

}


/* Puppy SVG */

.puppy-svg {

    width: 100%;
    height: 100%;

    overflow: visible;

    filter:

        drop-shadow(
            0 12px 18px
            rgba(0,0,0,0.3)
        );

}


/* Puppy walking movement */

.puppy.arrive .puppy-body {

    animation:

        puppyWalk
        0.6s
        ease-in-out
        infinite
        alternate;

}


@keyframes puppyWalk {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-5px);
    }

}


/* =====================================================
   GCSE PAPER
===================================================== */

.result-paper {

    opacity: 0;

    transform:
        translateX(40px)
        rotate(8deg);

    transition:

        opacity 0.8s ease,

        transform 0.8s ease;

}


/* Paper appears */

.puppy.show-paper .result-paper {

    opacity: 1;

    transform:
        translateX(0)
        rotate(-4deg);

}


/* =====================================================
   PAPER SHINE
===================================================== */

.paper-shine {

    animation:

        paperShine
        2.5s
        ease-in-out
        infinite;

}


@keyframes paperShine {

    0%,100% {
        opacity: 0.15;
    }

    50% {
        opacity: 0.5;
    }

}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    position: absolute;

    bottom: 6%;

    left: 0;

    width: 100%;

    text-align: center;

    color: #f5dfff;

    font-size:
        clamp(22px, 3vw, 42px);

    font-weight: bold;

    opacity: 0;

    z-index: 100;

    text-shadow:

        0 0 10px #c77dff,

        0 0 25px #9b5de5;

    transition:

        opacity 1s ease;

}


.message.show {

    opacity: 1;

}


/* =====================================================
   QUESTION MARKS
===================================================== */

.question {

    position: absolute;

    color: #d9a8ff;

    font-size: 38px;

    opacity: 0;

}


.question.one {

    left: 31%;

    top: 22%;

}


.question.two {

    left: 57%;

    top: 18%;

}


.question.show {

    opacity: 1;

    animation:

        questionFloat

        ease-in-out
        infinite
        alternate;

}


@keyframes questionFloat {

    from {

        transform:
            translateY(0)
            rotate(-8deg);

    }

    to {

        transform:
            translateY(-12px)
            rotate(8deg);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 750px) {

    }

        height: 270px;

    }


    .puppy.arrive {

        right: -5%;

    }


    .message {

        font-size: 21px;

        padding: 0 10px;

    }

}

</style>

/* =====================================================

===================================================== */

const meterFill =

/* =====================================================
   SADNESS FUNCTION

   0  = HAPPY
   50 = OKAY
   100 = SAD
===================================================== */

function setSadness(amount) {

    amount =
        Math.max(
            0,
            Math.min(
                100,
                amount
            )
        );


    meterFill.style.height =
        amount + "%";


    moodIndicator.style.bottom =
        amount + "%";


    sadnessNumber.textContent =
        "Sadness: " +
        Math.round(amount) +
        "%";

}
