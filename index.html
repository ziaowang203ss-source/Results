<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nervous Little Fox</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #090812;
    font-family: Arial, sans-serif;
}


/* =====================================================
   BACKGROUND
===================================================== */

.scene {
    width: 100%;
    height: 100vh;
    position: relative;

    background:
        radial-gradient(
            circle at 50% 45%,
            #302b4a 0%,
            #18152a 55%,
            #07060c 100%
        );
}


/* =====================================================
   SADNESS METER
===================================================== */

.sadness-meter {
    position: absolute;

    left: 35px;
    top: 50%;

    transform: translateY(-50%);

    width: 115px;

    z-index: 100;

    text-align: center;

    color: white;
}


/* Title */

.meter-title {
    font-size: 15px;

    font-weight: bold;

    letter-spacing: 1px;

    margin-bottom: 12px;

    color: #f4d8ff;

    text-shadow:
        0 0 8px #b56cff;
}


/* Meter */

.meter {
    position: relative;

    height: 360px;

    width: 100%;
}


/* Vertical bar */

.meter-track {
    position: absolute;

    left: 50%;

    top: 10px;

    transform: translateX(-50%);

    width: 24px;

    height: 300px;

    border-radius: 20px;

    background: #211d32;

    border: 3px solid #5b5275;

    box-shadow:
        0 0 12px rgba(190, 120, 255, 0.35);

    overflow: hidden;
}


/* Filled section */

.meter-fill {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;

    height: 75%;

    border-radius: 20px;

    background:
        linear-gradient(
            to top,
            #6b4cff,
            #9b6cff,
            #ff75b8
        );

    transition:
        height 1s ease;
}


/* Indicator */

.mood-indicator {
    position: absolute;

    left: 50%;

    bottom: 75%;

    transform:
        translate(-50%, 50%);

    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: white;

    border: 4px solid #ff75b8;

    box-shadow:
        0 0 10px #ff75b8,
        0 0 25px #ff75b8;

    transition:
        bottom 1s ease,
        border-color 1s ease,
        box-shadow 1s ease;
}


/* Mood labels */

.mood-label {
    position: absolute;

    left: 0;

    width: 100%;

    font-weight: bold;

    font-size: 17px;

    line-height: 20px;

    z-index: 5;
}

.mood-label span {
    font-size: 10px;

    letter-spacing: 1px;
}


/* Happy */

.mood-label.happy {
    top: -5px;

    transform: translateY(-100%);

    color: #ffe66d;
}


/* Okay */

.mood-label.okay {
    top: 145px;

    color: #d7d2e8;
}


/* Sad */

.mood-label.sad {
    bottom: -5px;

    transform: translateY(100%);

    color: #82b8ff;
}


/* Percentage */

.sadness-number {
    margin-top: 12px;

    font-size: 13px;

    color: #ddd7eb;

    transition: color 1s ease;
}


/* =====================================================
   FOX
===================================================== */

.fox {
    position: absolute;

    width: 390px;
    height: 430px;

    left: 50%;
    top: 48%;

    transform: translate(-50%, -50%);

    animation:
        nervousBody 0.7s ease-in-out infinite alternate;
}


/* Nervous shaking */

@keyframes nervousBody {

    from {
        transform:
            translate(-50%, -50%)
            rotate(-1deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(1deg);
    }
}


.fox-svg {
    width: 100%;
    height: 100%;

    overflow: visible;

    filter:
        drop-shadow(
            0 15px 20px rgba(0,0,0,0.35)
        );
}


/* =====================================================
   FLUFFY TAIL
===================================================== */

.tail {
    animation:
        nervousTail 0.9s ease-in-out infinite alternate;

    transform-origin: 105px 320px;
}


@keyframes nervousTail {

    from {
        transform: rotate(-5deg);
    }

    to {
        transform: rotate(6deg);
    }
}


/* =====================================================
   FUR MOVEMENT
===================================================== */

.fur-tuft {

    animation:
        furMove 0.8s ease-in-out infinite alternate;
}


@keyframes furMove {

    from {
        transform: translateX(-1px);
    }

    to {
        transform: translateX(1px);
    }
}


/* =====================================================
   EARS
===================================================== */

.ear-left {

    transform-origin: 125px 90px;

    animation:
        nervousEarLeft 1.2s ease-in-out infinite;
}


.ear-right {

    transform-origin: 275px 90px;

    animation:
        nervousEarRight 1.1s ease-in-out infinite;
}


@keyframes nervousEarLeft {

    0%, 100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(-8deg);
    }
}


@keyframes nervousEarRight {

    0%, 100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(8deg);
    }
}


/* =====================================================
   EYES
===================================================== */

.eye {

    animation:
        nervousBlink 3s infinite;
}


@keyframes nervousBlink {

    0%, 88%, 100% {
        transform: scaleY(1);
    }

    92% {
        transform: scaleY(0.15);
    }
}


/* =====================================================
   SWEAT
===================================================== */

.sweat {

    animation:
        sweatDrop 1.8s ease-in-out infinite;
}


@keyframes sweatDrop {

    0% {
        opacity: 0;
        transform: translateY(-5px);
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateY(45px);
    }
}


/* =====================================================
   TEXT
===================================================== */

.nervous-text {

    position: absolute;

    width: 100%;

    bottom: 8%;

    text-align: center;

    color: #f4d8ff;

    font-size:
        clamp(22px, 3vw, 42px);

    font-weight: bold;

    opacity: 0;

    animation:
        textAppear 1s ease forwards 1s;

    text-shadow:
        0 0 10px #c77dff,
        0 0 25px #9b5de5;
}


@keyframes textAppear {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =====================================================
   NERVOUS DOTS
===================================================== */

.dots {

    position: absolute;

    top: 19%;
    left: 50%;

    transform:
        translateX(-50%);

    color: #f4d8ff;

    font-size: 30px;

    letter-spacing: 12px;

    animation:
        dotsMove 1s ease-in-out infinite alternate;
}


@keyframes dotsMove {

    from {
        opacity: 0.35;

        transform:
            translateX(-50%)
            translateY(0);
    }

    to {
        opacity: 1;

        transform:
            translateX(-50%)
            translateY(-7px);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .sadness-meter {

        left: 10px;

        transform:
            translateY(-50%)
            scale(0.75);

        transform-origin:
            left center;
    }


    .fox {

        width: 320px;
        height: 360px;
    }


    .nervous-text {

        font-size: 23px;
    }


    .dots {

        top: 15%;
    }

}

</style>

<!-- =====================================================

<script>


/* =====================================================
   GET THE METER ELEMENTS
===================================================== */

const meterFill =
    document.getElementById("meterFill");

const moodIndicator =
    document.getElementById("moodIndicator");

const sadnessNumber =
    document.getElementById("sadnessNumber");


/* =====================================================
   SADNESS FUNCTION

   0%   = HAPPY
   50%  = OKAY
   100% = SAD
===================================================== */

function setSadness(amount) {

    /*
       Make sure the value cannot go below 0
       or above 100.
    */

    amount =
        Math.max(
            0,
            Math.min(100, amount)
        );


    /*
       Fill the bar.
    */

    meterFill.style.height =
        amount + "%";


    /*
       Move the white indicator.
    */

    moodIndicator.style.bottom =
        amount + "%";


    /*
       Update the percentage text.
    */

    sadnessNumber.textContent =
        "Sadness: " +
        Math.round(amount) +
        "%";
}


/* =====================================================
   STARTING MOOD
===================================================== */

setSadness(75);


/* =====================================================
   THE FOX GRADUALLY CALMS DOWN
===================================================== */


/*
   After 5 seconds:
   75% -> 45%
*/

setTimeout(function() {

    setSadness(45);

}, 5000);


/*
   After 8 seconds:
   45% -> 15%
*/

setTimeout(function() {

    setSadness(15);

}, 8000);


/*
   After 11 seconds:
   15% -> 5%
*/

setTimeout(function() {

    setSadness(5);

}, 11000);


</script>
